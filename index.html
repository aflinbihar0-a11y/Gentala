<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENTALA Offline</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; background-color: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 480px; margin: 0 auto; }
        h2 { margin-top: 0; color: #1e3a8a; font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: #334155; }
        input[type="text"], input[type="number"], input[type="date"], select { 
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 1rem; background-color: #f8fafc;
        }
        .radio-group { display: flex; gap: 20px; margin-top: 6px; }
        .radio-label { display: flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
        .note { font-size: 0.8rem; color: #64748b; font-style: italic; margin-top: -8px; margin-bottom: 12px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn-calc { background-color: #0284c7; color: white; }
        .btn-save { background-color: #2563eb; color: white; }
        .btn-sync { background-color: #059669; color: white; }
        .status-box { margin-top: 16px; padding: 12px; border-radius: 8px; background-color: #f1f5f9; font-size: 0.9rem; border-left: 4px solid #2563eb; }
        
        .result-card { display: none; margin-top: 16px; margin-bottom: 16px; padding: 14px; border-radius: 10px; background-color: #eff6ff; border: 1px solid #bfdbfe; }
        .result-title { font-weight: bold; color: #1e40af; margin-bottom: 8px; font-size: 0.95rem; border-bottom: 1px solid #dbeafe; padding-bottom: 4px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-top: 2px; }
        .bg-green { background-color: #dcfce7; color: #166534; }
        .bg-yellow { background-color: #fef9c3; color: #854d0e; }
        .bg-red { background-color: #fee2e2; color: #991b1b; }
        .z-score-val { font-size: 0.8rem; color: #475569; font-weight: normal; }
    </style>
</head>
<body>

<div class="card">
    <h2>📋 Form Input Data Pasien</h2>

    <div class="form-group">
        <label>Nama Anak</label>
        <input type="text" id="nama" placeholder="Masukkan nama anak">
    </div>

    <div class="form-group">
        <label>Alamat (Desa/Kelurahan)</label>
        <select id="alamat">
            <option value="Batu Tangga">Batu Tangga</option>
            <option value="Muara Hungi">Muara Hungi</option>
            <option value="Pembakulan">Pembakulan</option>
            <option value="Nateh">Nateh</option>
            <option value="Datar Batung">Datar Batung</option>
            <option value="Desa Lainnya">Desa Lainnya</option>
        </select>
    </div>

    <div class="form-group">
        <label>Jenis Kelamin</label>
        <div class="radio-group">
            <label class="radio-label"><input type="radio" name="jk" value="Laki-laki" checked> Laki-laki</label>
            <label class="radio-label"><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
        </div>
    </div>

    <p class="note">(Sesuai aturan Kemenkes, sisa hari tidak digenapkan ke atas. Contoh: 2 bulan 29 hari = 2 bulan)</p>

    <div class="form-group">
        <label>Tanggal Lahir</label>
        <input type="date" id="tgl_lahir">
    </div>

    <div class="form-group">
        <label>Tanggal Pemeriksaan</label>
        <input type="date" id="tgl_periksa">
    </div>

    <div class="form-group">
        <label>Tinggi/Panjang Badan (cm)</label>
        <input type="number" id="tb" step="0.1" placeholder="0.0">
    </div>

    <div class="form-group">
        <label>Berat Badan (kg)</label>
        <input type="number" id="bb" step="0.1" placeholder="0.0">
    </div>

    <button type="button" class="btn-calc" onclick="hitungGiziOffline()">📊 Hitung Status Gizi</button>

    <!-- Output Hasil Skrining Offline Presisi -->
    <div id="hasil_skrining" class="result-card">
        <div class="result-title">📊 Hasil Analisis Gizi (Standar Kemenkes):</div>
        <div style="margin-bottom: 6px;"><strong>Usia:</strong> <span id="res_usia">-</span></div>
        
        <div style="margin-top: 6px;">
            <strong>BB/U:</strong> <span id="res_bbu" class="badge">-</span> 
            <span id="sd_bbu" class="z-score-val"></span>
        </div>
        <div style="margin-top: 6px;">
            <strong>TB/U:</strong> <span id="res_tbu" class="badge">-</span> 
            <span id="sd_tbu" class="z-score-val"></span>
        </div>
        <div style="margin-top: 6px;">
            <strong>BB/TB:</strong> <span id="res_bbtb" class="badge">-</span> 
            <span id="sd_bbtb" class="z-score-val"></span>
        </div>
    </div>

    <button class="btn-save" onclick="simpanLokal()">💾 Simpan Data ke HP</button>
    <button class="btn-sync" onclick="sinkronkanData()">☁️ Kirim Data ke Cloud (Saat Ada Sinyal)</button>

    <div class="status-box">
        <strong>Antrean Data di HP:</strong> <span id="jumlah_data">0</span> anak
        <div id="log_status" style="margin-top: 6px;"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "PASANG_WEB_APP_URL_DI_SINI";

    // Set default tanggal hari ini
    document.getElementById('tgl_periksa').valueAsDate = new Date();

    // 1. Data Standar Antropometri Kemenkes (TB/U dan BB/U menurut Usia Bulan)
    const TABEL_KEMENKES = {
        TBU: {
            "Laki-laki": {
                0: {m: 49.9, sd_neg: 1.9, sd_pos: 1.9},
                12: {m: 75.7, sd_neg: 2.6, sd_pos: 2.6},
                24: {m: 87.8, sd_neg: 3.35, sd_pos: 3.35},
                36: {m: 96.1, sd_neg: 3.8, sd_pos: 3.8},
                48: {m: 103.3, sd_neg: 4.2, sd_pos: 4.2},
                60: {m: 110.0, sd_neg: 4.5, sd_pos: 4.5}
            },
            "Perempuan": {
                0: {m: 49.1, sd_neg: 1.9, sd_pos: 1.9},
                12: {m: 74.0, sd_neg: 2.6, sd_pos: 2.6},
                24: {m: 86.4, sd_neg: 3.4, sd_pos: 3.4},
                36: {m: 95.1, sd_neg: 3.8, sd_pos: 3.8},
                48: {m: 102.7, sd_neg: 4.2, sd_pos: 4.2},
                60: {m: 109.4, sd_neg: 4.5, sd_pos: 4.5}
            }
        },
        BBU: {
            "Laki-laki": {
                0: {m: 3.3, sd_neg: 0.4, sd_pos: 0.5},
                12: {m: 9.6, sd_neg: 1.0, sd_pos: 1.2},
                24: {m: 12.2, sd_neg: 1.21, sd_pos: 1.5},
                36: {m: 14.3, sd_neg: 1.4, sd_pos: 1.8},
                48: {m: 16.3, sd_neg: 1.7, sd_pos: 2.2},
                60: {m: 18.3, sd_neg: 2.0, sd_pos: 2.6}
            },
            "Perempuan": {
                0: {m: 3.2, sd_neg: 0.4, sd_pos: 0.5},
                12: {m: 8.9, sd_neg: 0.9, sd_pos: 1.1},
                24: {m: 11.5, sd_neg: 1.2, sd_pos: 1.5},
                36: {m: 13.9, sd_neg: 1.4, sd_pos: 1.8},
                48: {m: 16.1, sd_neg: 1.7, sd_pos: 2.3},
                60: {m: 18.2, sd_neg: 2.0, sd_pos: 2.7}
            }
        }
    };

    // 2. Data Standar Antropometri Kemenkes (BB/TB berdasarkan Tinggi/Panjang Badan)
    const TABEL_BBTB = {
        "Laki-laki": {
            65: {m: 7.4, sd_neg: 0.60, sd_pos: 0.65},
            70: {m: 8.6, sd_neg: 0.65, sd_pos: 0.70},
            75: {m: 9.5, sd_neg: 0.70, sd_pos: 0.80},
            80: {m: 10.4, sd_neg: 0.75, sd_pos: 0.85},
            85: {m: 11.4, sd_neg: 0.80, sd_pos: 0.95},
            90: {m: 12.5, sd_neg: 0.90, sd_pos: 1.05},
            95: {m: 13.7, sd_neg: 1.00, sd_pos: 1.15},
            100: {m: 15.0, sd_neg: 1.10, sd_pos: 1.30},
            105: {m: 16.4, sd_neg: 1.20, sd_pos: 1.45},
            110: {m: 18.0, sd_neg: 1.30, sd_pos: 1.60}
        },
        "Perempuan": {
            65: {m: 7.0, sd_neg: 0.55, sd_pos: 0.60},
            70: {m: 8.0, sd_neg: 0.60, sd_pos: 0.65},
            75: {m: 9.0, sd_neg: 0.65, sd_pos: 0.75},
            80: {m: 10.0, sd_neg: 0.70, sd_pos: 0.80},
            85: {m: 11.0, sd_neg: 0.75, sd_pos: 0.90},
            90: {m: 12.1, sd_neg: 0.85, sd_pos: 1.00},
            95: {m: 13.3, sd_neg: 0.95, sd_pos: 1.10},
            100: {m: 14.6, sd_neg: 1.05, sd_pos: 1.25},
            105: {m: 16.0, sd_neg: 1.15, sd_pos: 1.40},
            110: {m: 17.6, sd_neg: 1.25, sd_pos: 1.55}
        }
    };

    function hitungUsiaBulan(tglLahirStr, tglPeriksaStr) {
        if (!tglLahirStr || !tglPeriksaStr) return null;
        let d1 = new Date(tglLahirStr);
        let d2 = new Date(tglPeriksaStr);
        let months = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth());
        if (d2.getDate() < d1.getDate()) months--;
        return months < 0 ? 0 : months;
    }

    // Interpolasi Presisi Nilai Standar Deviasi Kemenkes berdasarkan Usia
    function getReferenceData(indikator, jk, usiaBulan) {
        let table = TABEL_KEMENKES[indikator][jk];
        let keys = Object.keys(table).map(Number).sort((a, b) => a - b);
        
        if (table[usiaBulan]) return table[usiaBulan];

        let lowerKey = keys[0];
        let upperKey = keys[keys.length - 1];

        for (let i = 0; i < keys.length - 1; i++) {
            if (usiaBulan >= keys[i] && usiaBulan <= keys[i + 1]) {
                lowerKey = keys[i];
                upperKey = keys[i + 1];
                break;
            }
        }

        let factor = (usiaBulan - lowerKey) / (upperKey - lowerKey);
        let m = table[lowerKey].m + factor * (table[upperKey].m - table[lowerKey].m);
        let sd_neg = table[lowerKey].sd_neg + factor * (table[upperKey].sd_neg - table[lowerKey].sd_neg);
        let sd_pos = table[lowerKey].sd_pos + factor * (table[upperKey].sd_pos - table[lowerKey].sd_pos);

        return { m, sd_neg, sd_pos };
    }

    // Interpolasi Presisi Nilai Standar Deviasi Kemenkes berdasarkan Tinggi Badan (BB/TB)
    function getBBTBReference(jk, tb) {
        let table = TABEL_BBTB[jk];
        let keys = Object.keys(table).map(Number).sort((a, b) => a - b);
        
        if (tb <= keys[0]) return table[keys[0]];
        if (tb >= keys[keys.length - 1]) return table[keys[keys.length - 1]];

        let lowerKey = keys[0];
        let upperKey = keys[keys.length - 1];

        for (let i = 0; i < keys.length - 1; i++) {
            if (tb >= keys[i] && tb <= keys[i + 1]) {
                lowerKey = keys[i];
                upperKey = keys[i + 1];
                break;
            }
        }

        let factor = (tb - lowerKey) / (upperKey - lowerKey);
        let m = table[lowerKey].m + factor * (table[upperKey].m - table[lowerKey].m);
        let sd_neg = table[lowerKey].sd_neg + factor * (table[upperKey].sd_neg - table[lowerKey].sd_neg);
        let sd_pos = table[lowerKey].sd_pos + factor * (table[upperKey].sd_pos - table[lowerKey].sd_pos);

        return { m, sd_neg, sd_pos };
    }

    function hitungZScore(nilai, ref) {
        if (nilai < ref.m) {
            return (nilai - ref.m) / ref.sd_neg;
        } else {
            return (nilai - ref.m) / ref.sd_pos;
        }
    }

    function hitungGiziOffline() {
        let tglLahir = document.getElementById("tgl_lahir").value;
        let tglPeriksa = document.getElementById("tgl_periksa").value;
        let tb = parseFloat(document.getElementById("tb").value);
        let bb = parseFloat(document.getElementById("bb").value);
        let jk = document.querySelector('input[name="jk"]:checked').value;

        if (!tglLahir || isNaN(tb) || isNaN(bb) || tb <= 0 || bb <= 0) {
            alert("Mohon lengkapi Tanggal Lahir, TB, dan BB terlebih dahulu!");
            document.getElementById("hasil_skrining").style.display = "none";
            return;
        }

        let usiaBulan = hitungUsiaBulan(tglLahir, tglPeriksa);
        if (usiaBulan === null || usiaBulan > 60) {
            alert("Perhitungan ini khusus untuk anak usia 0 - 60 bulan.");
            document.getElementById("hasil_skrining").style.display = "none";
            return;
        }

        // 1. Hitung Z-Score TB/U
        let refTBU = getReferenceData("TBU", jk, usiaBulan);
        let zTBU = hitungZScore(tb, refTBU);

        // 2. Hitung Z-Score BB/U
        let refBBU = getReferenceData("BBU", jk, usiaBulan);
        let zBBU = hitungZScore(bb, refBBU);

        // 3. Hitung Z-Score BB/TB Presisi
        let refBBTB = getBBTBReference(jk, tb);
        let zBBTB = hitungZScore(bb, refBBTB);

        // Klasifikasi Kemenkes
        let statusTBU = "Normal"; let classTBU = "bg-green";
        if (zTBU < -3) { statusTBU = "Sangat Pendek (Severely Stunted)"; classTBU = "bg-red"; }
        else if (zTBU < -2) { statusTBU = "Pendek (Stunted)"; classTBU = "bg-yellow"; }
        else if (zTBU > 3) { statusTBU = "Tinggi"; classTBU = "bg-green"; }

        let statusBBU = "BB Normal"; let classBBU = "bg-green";
        if (zBBU < -3) { statusBBU = "BB Sangat Kurang"; classBBU = "bg-red"; }
        else if (zBBU < -2) { statusBBU = "Berat Badan Kurang"; classBBU = "bg-yellow"; }
        else if (zBBU > 1) { statusBBU = "Risiko BB Lebih"; classBBU = "bg-yellow"; }

        let statusBBTB = "Gizi Baik (Normal)"; let classBBTB = "bg-green";
        if (zBBTB < -3) { statusBBTB = "Gizi Buruk"; classBBTB = "bg-red"; }
        else if (zBBTB < -2) { statusBBTB = "Gizi Kurang"; classBBTB = "bg-yellow"; }
        else if (zBBTB > 2) { statusBBTB = "Gizi Lebih / Obesitas"; classBBTB = "bg-red"; }
        else if (zBBTB > 1) { statusBBTB = "Berisiko Gizi Lebih"; classBBTB = "bg-yellow"; }

        // Tampilkan Hasil + Nilai Z-Score SD
        document.getElementById("res_usia").innerText = `${usiaBulan} Bulan`;
        
        let elTBU = document.getElementById("res_tbu");
        elTBU.innerText = statusTBU; elTBU.className = `badge ${classTBU}`;
        document.getElementById("sd_tbu").innerText = `(${zTBU.toFixed(2)} SD)`;

        let elBBU = document.getElementById("res_bbu");
        elBBU.innerText = statusBBU; elBBU.className = `badge ${classBBU}`;
        document.getElementById("sd_bbu").innerText = `(${zBBU.toFixed(2)} SD)`;

        let elBBTB = document.getElementById("res_bbtb");
        elBBTB.innerText = statusBBTB; elBBTB.className = `badge ${classBBTB}`;
        document.getElementById("sd_bbtb").innerText = `(${zBBTB.toFixed(2)} SD)`;

        document.getElementById("hasil_skrining").style.display = "block";
    }

    function updateCount() {
        let dataLokal = JSON.parse(localStorage.getItem("gentala_offline_data") || "[]");
        document.getElementById("jumlah_data").innerText = dataLokal.length;
    }

    function simpanLokal() {
        let nama = document.getElementById("nama").value;
        let alamat = document.getElementById("alamat").value;
        let jk = document.querySelector('input[name="jk"]:checked').value;
        let tgl_lahir = document.getElementById("tgl_lahir").value;
        let tgl_periksa = document.getElementById("tgl_periksa").value;
        let tb = document.getElementById("tb").value;
        let bb = document.getElementById("bb").value;

        if(!nama || !tgl_lahir || !tb || !bb) {
            alert("Mohon lengkapi Nama, Tanggal Lahir, TB, dan BB!");
            return;
        }

        if(document.getElementById("hasil_skrining").style.display !== "block") {
            hitungGiziOffline();
        }

        let entriBaru = {
            timestamp: new Date().toLocaleString("id-ID"),
            nama_anak: nama,
            alamat: alamat,
            jk: jk,
            tgl_lahir: tgl_lahir,
            tgl_periksa: tgl_periksa,
            usia_bulan: document.getElementById("res_usia").innerText,
            tb: parseFloat(tb),
            bb: parseFloat(bb),
            status_tbu: document.getElementById("res_tbu").innerText,
            status_bbu: document.getElementById("res_bbu").innerText,
            status_bbtb: document.getElementById("res_bbtb").innerText
        };

        let dataLokal = JSON.parse(localStorage.getItem("gentala_offline_data") || "[]");
        dataLokal.push(entriBaru);
        localStorage.setItem("gentala_offline_data", JSON.stringify(dataLokal));

        document.getElementById("nama").value = "";
        document.getElementById("tgl_lahir").value = "";
        document.getElementById("tb").value = "";
        document.getElementById("bb").value = "";
        document.getElementById("hasil_skrining").style.display = "none";
        document.getElementById("log_status").innerHTML = "<span style='color: #059669;'>✅ Data + Hasil Skrining berhasil tersimpan di HP!</span>";
        updateCount();
    }

    async function sinkronkanData() {
        let dataLokal = JSON.parse(localStorage.getItem("gentala_offline_data") || "[]");
        if(dataLokal.length === 0) {
            alert("Tidak ada antrean data offline.");
            return;
        }

        if(!navigator.onLine) {
            alert("Belum ada koneksi internet. Coba lagi setelah mendapat sinyal!");
            return;
        }

        document.getElementById("log_status").innerText = "⏳ Mengunggah data...";

        try {
            for(let i = 0; i < dataLokal.length; i++) {
                await fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dataLokal[i])
                });
            }
            localStorage.removeItem("gentala_offline_data");
            document.getElementById("log_status").innerHTML = "<span style='color: #059669;'>🎉 Semua data tersinkronisasi!</span>";
            updateCount();
        } catch(err) {
            document.getElementById("log_status").innerText = "❌ Gagal kirim. Cek koneksi internet.";
        }
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker Registered'))
                .catch(err => console.log('SW Registration Failed', err));
        });
    }

    updateCount();
</script>
</body>
</html>
